name: colongsvo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.0.0
  - torchvision=0.15.0
  - pytorch-cuda=11.7
  - pip:
    - -r requirements.txt
    - submodules/diff-gaussian-rasterization
    - submodules/simple-knn
    - git+https://github.com/facebookresearch/pytorch3d.git@v0.7.8
    - git+https://github.com/princeton-vl/lietorch.git
